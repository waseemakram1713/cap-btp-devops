name: SAP CAP Deploy to SAP BTP Cloud Foundry

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      #---------------------------------------------------
      # Checkout Repository
      #---------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      #---------------------------------------------------
      # Setup Node.js
      #---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      #---------------------------------------------------
      # Install Dependencies
      #---------------------------------------------------
      - name: Install Dependencies
        run: npm ci

      #---------------------------------------------------
      # Build CAP Project
      #---------------------------------------------------
      - name: Build CAP Project
        run: npx cds build

      #---------------------------------------------------
      # Install MTA Build Tool
      #---------------------------------------------------
      - name: Install MBT
        run: npm install -g mbt

      #---------------------------------------------------
      # Build MTAR
      #---------------------------------------------------
      - name: Build MTAR
        run: mbt build

      #---------------------------------------------------
      # Install Cloud Foundry CLI v8
      #---------------------------------------------------
      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli
          sudo ln -sf /usr/bin/cf8 /usr/local/bin/cf
          cf version

      #---------------------------------------------------
      # Install MultiApps Plugin
      #---------------------------------------------------
      - name: Install MultiApps Plugin
        run: |
          cf install-plugin multiapps -f
          cf plugins

      #---------------------------------------------------
      # Login to Cloud Foundry
      #---------------------------------------------------
      - name: Login to Cloud Foundry
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          CF_USER: ${{ secrets.CF_USER }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
        run: |
          cf api "$CF_API_URL"
          cf auth "$CF_USER" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      #---------------------------------------------------
      # Show Target
      #---------------------------------------------------
      - name: Verify Target
        run: cf target

      #---------------------------------------------------
      # Deploy MTAR
      #---------------------------------------------------
      - name: Deploy MTAR
        run: |
          MTAR_FILE=$(find mta_archives -name "*.mtar" | head -n 1)

          if [ -z "$MTAR_FILE" ]; then
            echo "No MTAR file found."
            exit 1
          fi

          echo "Deploying $MTAR_FILE"

          cf deploy "$MTAR_FILE" -f

      #---------------------------------------------------
      # Verify Deployment
      #---------------------------------------------------
      - name: Verify Deployment
        run: |
          cf apps